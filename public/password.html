
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Secret ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;

      font-family: Georgia, "Times New Roman", serif;
      color: #604448;

      background: #F5EEE2;
    }

    .card {
      width: 100%;
      max-width: 600px;
      padding: 48px 32px;
      text-align: center;

      background: #FFFDF8;
      border: 1px solid #E8DCCE;
      border-radius: 2px;

      box-shadow: 0 10px 35px rgba(96, 68, 72, 0.08);
    }

    .eyebrow {
      margin-bottom: 18px;
      color: #B47D6A;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .heart {
      margin-bottom: 18px;
      font-size: 38px;
    }

    h1 {
      margin: 0 0 22px;
      color: #604448;
      font-size: clamp(36px, 8vw, 52px);
      font-weight: normal;
      line-height: 1.15;
    }

    h1 span {
      color: #BD737F;
      font-style: italic;
    }

    p {
      margin: 14px 0;
      color: #896F6D;
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.8;
    }

    form {
      margin-top: 30px;
    }

    input {
      display: block;
      width: 100%;
      padding: 15px 16px;

      background: #FFFDF8;
      border: 1px solid #D7B8B4;
      border-radius: 2px;

      color: #604448;
      font-family: Arial, sans-serif;
      font-size: 16px;
      outline: none;

      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #A18A85;
    }

    input:focus {
      border-color: #BD737F;
      box-shadow: 0 0 0 3px rgba(189, 115, 127, 0.13);
    }

    button {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 16px;

      background: #BD737F;
      border: none;
      border-radius: 40px;

      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;

      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #A96170;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 2px solid #604448;
      outline-offset: 4px;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      color: #A96170;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 28px;
      color: #A88B80;
      font-size: 13px;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 22px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <div class="eyebrow">A little world, just for you</div>

    <div class="heart">♡</div>

    <h1>
      A Little<br>
      <span>Secret.</span>
    </h1>

    <p>
      This little corner of the internet is just for you. ❤️
    </p>

    <p>
      Enter our secret password to open your birthday surprise.
    </p>

    <form id="password-form">
      <input
        id="password"
        type="password"
        placeholder="Enter our secret password"
        autocomplete="current-password"
        required
        autofocus
      >

      <button type="submit">
        Unlock Your Surprise &nbsp; ♡
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="footer">
      made with love, just for you ✨
    </div>

<form id="password-form" method="post" action="/__birthday-login">
  <input
    id="password"
    type="password"
    name="password"
    placeholder="Enter our secret password"
    autocomplete="current-password"
    required
  >
  <button type="submit">Unlock Your Surprise ♡</button>
</form>

<div id="message" role="status" aria-live="polite"></div>
  

  </main>

  
</body>
</html>
